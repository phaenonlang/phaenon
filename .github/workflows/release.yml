# Releases (design/tooling.md §3.2) are cut by merging release-please's
# release PR. On every push to main, release-please (release-please-config.json,
# .release-please-manifest.json) keeps one PR open, "chore(main): release
# X.Y.Z", whose version and CHANGELOG.md entry come from the Conventional
# Commits since the last release, and release-checksums.yml pins the binaries
# in it. Merging the PR is the release: the push of its squash commit runs
# this workflow, which builds the binaries and the playground's assets (§3.6)
# again from the merged commit and goes on only when they match the
# checksums the PR pinned; release-please then tags the commit vX.Y.Z and
# makes the GitHub release, and the assets and the source tarball go onto
# it, then onto https://phaenon.dev/releases/ (phaenonlang/website,
# «Uploading a release»).
#
# Why the publish runs here rather than on the tag: release-please creates
# the tag through the API with this workflow's GITHUB_TOKEN, and nothing that
# token creates starts a workflow (GitHub's recursion guard), so a `push:
# tags` workflow would never run. A token of another identity for
# release-please would lift that, at the price of a secret to keep and
# rotate; publishing in the same run needs none, and lets the assets be
# compared with the pins before the tag exists: a merged release whose bytes
# do not match its pins is never tagged. To give such a release up, take the
# `autorelease: pending` label off its PR: release-please then proposes the
# version again from the commits since the last tag.
#
# Run by hand with a tag, the workflow uploads a release that exists already
# to phaenon.dev and publishes nothing again.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing release to upload to phaenon.dev, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One release-please at a time; a push that waits is not cancelled by the
    # next one, which sees what it would have seen anyway.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write # the release PR's branch, the tag, the release and its assets
      pull-requests: write # the release PR
      issues: write # its autorelease labels
      actions: write # release-checksums.yml, started on the release PR
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
      tag: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Find the merged release PR release-please is to tag
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # release-please tags the merge commit of every merged PR still
          # labelled "autorelease: pending", and labels it "autorelease: tagged".
          prs=$(gh pr list -R "$GITHUB_REPOSITORY" --base main --state merged --label 'autorelease: pending' \
            --json number,mergeCommit --jq 'map({number, sha: .mergeCommit.oid})')
          case $(jq length <<<"$prs") in
            0) echo "No merged release PR awaits its tag" ;;
            1) echo "Release PR #$(jq -r '.[0].number' <<<"$prs") awaits its tag"
               echo "sha=$(jq -r '.[0].sha' <<<"$prs")" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::several merged release PRs await their tags: $(jq -r 'map("#\(.number)") | join(", ")' <<<"$prs")"
               exit 1 ;;
          esac
      - uses: actions/checkout@v7
        if: steps.pending.outputs.sha != ''
        with:
          ref: ${{ steps.pending.outputs.sha }}
      - uses: actions/setup-go@v7
        if: steps.pending.outputs.sha != ''
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the release assets and compare them with the pinned checksums
        id: built
        if: steps.pending.outputs.sha != ''
        run: |
          set -euo pipefail
          version=$(jq -r .version composer/checksums.json)
          go run ./tools/release -version "$version" -out dist -verify
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Archive the whole source tree
        if: steps.pending.outputs.sha != ''
        # .gitattributes keeps all but the plugin out of the Composer dist,
        # and out of GitHub's own source archives with it; the release
        # carries the tree.
        env:
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          echo '* -export-ignore' >> .git/info/attributes
          git archive --format=tar.gz --prefix="phn-$VERSION/" -o "dist/phn-$VERSION-src.tar.gz" HEAD
      - name: release-please
        id: release-please
        uses: googleapis/release-please-action@v5
      - name: Check that the release is the commit just verified
        if: steps.release-please.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release-please.outputs.tag_name }}
          TAGGED: ${{ steps.release-please.outputs.sha }}
          VERIFIED: ${{ steps.pending.outputs.sha }}
          VERSION: ${{ steps.built.outputs.version }}
        run: |
          if [ "$TAGGED" != "$VERIFIED" ] || [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release-please made $TAG at $TAGGED; the assets were built for v$VERSION at $VERIFIED"
            exit 1
          fi
      - name: Publish the assets on the release
        if: steps.release-please.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
      - name: Pin the binaries in the release PR
        if: steps.release-please.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release-please.outputs.pr).headBranchName }}
        run: gh workflow run release-checksums.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH"

  website:
    # The release's files onto https://phaenon.dev/releases/<version>/. After
    # a release is made; alone when run by hand with a tag. Skipped while the
    # publisher's secrets are not set.
    needs: release
    if: ${{ !cancelled() && ((needs.release.result == 'success' && needs.release.outputs.created == 'true') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
      TEQUILA_SITES_CLIENT_ID: ${{ secrets.TEQUILA_SITES_CLIENT_ID }}
      TEQUILA_SITES_CLIENT_SECRET: ${{ secrets.TEQUILA_SITES_CLIENT_SECRET }}
      WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The checksums the release was pinned at, whichever branch ran this.
          ref: ${{ env.TAG }}
      - name: Fetch the release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --dir release
      - name: Upload them to phaenon.dev
        if: env.TEQUILA_SITES_CLIENT_ID != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Every binary is the one composer/checksums.json pins, before a byte goes out.
          jq -r '.assets[] | "\(.sha256)  release/\(.file)"' composer/checksums.json | sha256sum --check --strict
          token=$(printf %s "$TEQUILA_SITES_CLIENT_SECRET" | curl -fsS https://id.tequila.dev/oauth/token \
            -d grant_type=client_credentials -d audience=sites:phaenon -d "client_id=$TEQUILA_SITES_CLIENT_ID" \
            --data-urlencode client_secret@- | jq -r .access_token)
          echo "::add-mask::$token"
          printf 'Authorization: Bearer %s\n' "$token" > "$RUNNER_TEMP/auth"
          for file in release/*; do
            name=$(basename "$file")
            code=$(curl -sS -o "$RUNNER_TEMP/answer" -w '%{http_code}' -T "$file" \
              "https://sites.tequila.dev/api/v1/sites/phaenon/downloads/$version/$name" \
              -H @"$RUNNER_TEMP/auth" -H "X-Tequila-Sha256: $(sha256sum "$file" | cut -d' ' -f1)" \
              -H 'Content-Type: application/octet-stream')
            case "$code" in
              201) echo "uploaded $version/$name" ;;
              200) echo "already there: $version/$name" ;;
              *) echo "::error::$version/$name: HTTP $code $(cat "$RUNNER_TEMP/answer")"; exit 1 ;;
            esac
          done
      - name: Refresh the download page
        if: env.TEQUILA_SITES_CLIENT_ID != '' && env.WEBSITE_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WEBSITE_DISPATCH_TOKEN }}
        run: gh api repos/phaenonlang/website/dispatches -f event_type=phaenon-release -f "client_payload[version]=${TAG#v}"
